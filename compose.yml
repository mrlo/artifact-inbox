name: artifact-inbox

services:
  artifact-inbox:
    build: .
    image: ghcr.io/mrlo/artifact-inbox:latest
    container_name: artifact-inbox
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 256m
    env_file: .env
    ports:
      # Localhost only. Set INBOX_UI_PASSWORD in .env for built-in login, or put an
      # authenticating proxy in front before exposing it (see docs/DEPLOYMENT.md).
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data   # must be writable by uid 1000: mkdir -p data && chown 1000:1000 data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
