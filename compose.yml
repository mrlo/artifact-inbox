name: read

services:
  read:
    build: .
    image: read-inbox:local
    container_name: read
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 256m
    env_file: .env
    ports:
      # Localhost only. The web UI has NO login of its own: put an authenticating
      # reverse proxy in front before exposing it (see docs/DEPLOYMENT.md).
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data   # must be writable by uid 1000: mkdir -p data && chown 1000:1000 data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
